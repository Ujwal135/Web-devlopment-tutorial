<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackers-Terminal </title>
</head>
<body>
    <style>
         @import url("https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
        body{
            background-color: green;
            color: rgb(115, 15, 15);
            
        }
        .box{
            margin-top: 150px;
            border: 2px solid black;
            width: 70vw;
            height: 70vh;
            justify-self: center;
            justify-content: center;
            justify-items: center;
            align-content: center;
            font-size: 40px;
            font-family: "Roboto";
        }
        .text{
              animation: blink 4s steps(2) infinite;
              color: black;
              /* background-color: black; */
              
        }

        @keyframes blink {
        0%   { opacity: 2; }
        50%  { opacity: 0; }
        100% { opacity: 2; }
        }
    </style>
    <div class="box">
        <div class="text"> Hiii this is text</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
