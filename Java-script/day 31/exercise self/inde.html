<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>To-do-list</title>

</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    *{
        margin: 0;
        padding: 0;
    }
    body{
        background-color: beige;
    }
    .main_box{
        /* justify-content: center; */
        justify-self: center;
        position: absolute;
        top: 22%;
        left: 20%;
        align-items: center;
        border: 2px solid black;
        width: 60vw;
        height: 70vh;
        background-color: black; 
        font-family: "Montserrat Alternates", sans-serif;
        font-weight: 1000;
        font-style: normal;
        border-radius: 20px;
        
        
    }

    ul{
        text-align: center;
        margin: 60px;
        font-size: 35px;
        color: white;
        text-shadow: rgba(227, 222, 222, 0.447) 0px 5px 15px;
        
    }
    ul > li{
        align-items: center;
        /* justify-content: center; */
        justify-self: center;
        margin-top: 150px;
        margin: 30px;
        list-style: none;
    }

   
    
    
    .text{
        width: 800px;
        height: 55px;
        position: absolute;
        left: 70px;
        border-radius: 20px;
        box-shadow: rgba(170, 168, 168, 0.633) 0px 5px 15px;
    }
    button > svg{
        position: absolute;
        right: 190px;
        top: 134px;
        width: 60px;
        height: 60px;
        border-radius: 50px;
        
    }
    :placeholder-shown{
        font-family: "Montserrat Alternates", sans-serif;
        text-align: center;
    }

</style>

    <div class="main_box">
        <ul>Enter Your Tasks
